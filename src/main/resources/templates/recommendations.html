<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="menu">
<head>
    <meta charset="UTF-8">
    <title>Recommendations</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <style>
        .recommendation-card {
            margin-bottom: 20px;
        }
        .recommendation-card .card-body {
            padding: 10px;
        }
        .recommendation-card img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="card mt-3">
            <div class="card-header bg-dark text-white">
                Recommandations pour vous
            </div>
            <div class="card-body">
                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col" th:each="s : ${recommendation.products}">
                        <div class="card recommendation-card h-100">
                            <img th:src="@{'/' + ${s.image}}" class="card-img-top" alt="Image de la recommandation">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${s.fullName}"></h5>
                                <p class="card-text" th:text="${s.subtitle}"></p>
                                <p class="card-text"><strong>Prix: </strong><span th:text="${s.price}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="row">
                    <div class="col text-center">
                        <a class="btn btn-outline-secondary" th:href="@{/product}">Retour aux produits</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
